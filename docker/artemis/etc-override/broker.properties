# =============================================================================
#  Demo Artemis broker for the console (docker compose, integration tests).
#  Extends the broker.xml created by the image. Users — artemis-users.properties.
#
#  IMPORTANT: Artemis applies only the most specific matching security-setting;
#  permissions from "#" are not inherited — that is why role amq (admin) is listed in every rule.
# =============================================================================

# --------------------------------------------------------------- queues
# Commands to the orchestrator (ANYCAST, single queue)
addressConfigurations."orch.payment.commands".routingTypes=ANYCAST
addressConfigurations."orch.payment.commands".queueConfigs."orch.payment.commands".routingType=ANYCAST
addressConfigurations."orch.payment.commands".queueConfigs."orch.payment.commands".address=orch.payment.commands
# Events (MULTICAST, one queue per subscriber)
addressConfigurations."orch.payment.events".routingTypes=MULTICAST
addressConfigurations."orch.payment.events".queueConfigs."orch.payment.events.notifier".routingType=MULTICAST
addressConfigurations."orch.payment.events".queueConfigs."orch.payment.events.notifier".address=orch.payment.events
addressConfigurations."orch.payment.events".queueConfigs."orch.payment.events.archive".routingType=MULTICAST
addressConfigurations."orch.payment.events".queueConfigs."orch.payment.events.archive".address=orch.payment.events

# ------------------------------------------------------------ permissions
# console-browse — browsing only (the console's minimal permissions)
# console-manage — counters and queue list via management (optional)
# console-send   — publishing to orch.payment.commands
securityRoles."orch.#".amq.send=true
securityRoles."orch.#".amq.consume=true
securityRoles."orch.#".amq.browse=true
securityRoles."orch.#".amq.manage=true
securityRoles."orch.#".amq.createAddress=true
securityRoles."orch.#".amq.createDurableQueue=true
securityRoles."orch.#".amq.createNonDurableQueue=true
securityRoles."orch.#".console-browse.browse=true

securityRoles."orch.payment.commands".amq.send=true
securityRoles."orch.payment.commands".amq.consume=true
securityRoles."orch.payment.commands".amq.browse=true
securityRoles."orch.payment.commands".amq.manage=true
securityRoles."orch.payment.commands".amq.createAddress=true
securityRoles."orch.payment.commands".amq.createDurableQueue=true
securityRoles."orch.payment.commands".console-browse.browse=true
securityRoles."orch.payment.commands".console-send.send=true

securityRoles."DLQ".amq.send=true
securityRoles."DLQ".amq.consume=true
securityRoles."DLQ".amq.browse=true
securityRoles."DLQ".amq.manage=true
securityRoles."DLQ".console-browse.browse=true

securityRoles."activemq.management.#".amq.send=true
securityRoles."activemq.management.#".amq.consume=true
securityRoles."activemq.management.#".amq.manage=true
securityRoles."activemq.management.#".amq.createNonDurableQueue=true
securityRoles."activemq.management.#".amq.deleteNonDurableQueue=true
securityRoles."activemq.management.#".amq.createAddress=true
securityRoles."activemq.management.#".amq.deleteAddress=true
securityRoles."activemq.management.#".amq.browse=true
securityRoles."activemq.management.#".console-manage.manage=true

# management reply queue: the console creates a temporary queue admin-console.reply.<uuid>
securityRoles."admin-console.reply.#".console-manage.createNonDurableQueue=true
securityRoles."admin-console.reply.#".console-manage.deleteNonDurableQueue=true
securityRoles."admin-console.reply.#".console-manage.createAddress=true
securityRoles."admin-console.reply.#".console-manage.deleteAddress=true
securityRoles."admin-console.reply.#".console-manage.consume=true
# the broker sends the management reply on behalf of the requesting user
securityRoles."admin-console.reply.#".console-manage.send=true
