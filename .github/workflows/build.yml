name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests + integration tests on PostgreSQL, Kafka, Artemis and an AD emulator (Testcontainers)
      - run: ./mvnw -B verify
      # Production bundle (Vaadin frontend build) must also succeed
      - run: ./mvnw -B -Pproduction -DskipTests package
